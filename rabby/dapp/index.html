<!doctype html>
<meta charset="utf-8">
<title>BitBox e2e dapp</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1em; }
  #chain { font-weight: bold; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f6f8fa; padding: .5em; }
</style>
<h1>BitBox e2e dapp</h1>
<p>Chain: <span id="chain">?</span></p>
<pre id="log"></pre>
<script>
  // flow.ts drives this page through window.call(); every request and its answer is logged here,
  // so the dapp-side screenshots show what the wallet returned.
  const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
  const showChain = async () => {
    document.getElementById('chain').textContent = await window.ethereum.request({ method: 'eth_chainId' });
  };
  window.call = async (method, params) => {
    log(`> ${method}`);
    try {
      const r = await window.ethereum.request({ method, params });
      log(`< ${JSON.stringify(r)}`);
      await showChain();
      return { ok: r };
    } catch (e) {
      log(`! ${e.message}`);
      return { err: e.message, code: e.code };
    }
  };
</script>
