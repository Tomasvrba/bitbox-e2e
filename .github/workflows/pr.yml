name: change

# Runs one change in one BitBox repo against its merge-base and uploads the combined report.
# Can be triggered manually (workflow_dispatch) or called from another repo's PR workflow
# (workflow_call, see ci/pr-caller.yml) where PR description checkboxes select which flows run.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repo the change is in
        type: choice
        options: [firmware, app, api-rs, api-go, api-ts, rabby]
        default: firmware
      head:
        description: Head, a branch or commit
        required: true
      head_repo:
        description: Fork holding head (owner/repo). Empty when head is in the upstream repo.
        default: ''
      base:
        description: Base, a branch or commit of the upstream repo. Empty = its default branch.
        default: ''
      pins:
        description: "Other repos at a fixed version on both sides, e.g. 'firmware=v9.24.0 api-rs=v0.12.0'. Empty = latest."
        default: ''
      graphical:
        description: "Firmware/API change: unit globs to also run on the graphical simulator, e.g. 'btc-vector/*fee*'"
        default: ''
      tests:
        description: "App change: test files to run (e.g. 'tests/watch-only.test.ts'). Empty = all."
        default: ''
      flows:
        description: "Only these flows, e.g. 'device wc' (device, app, wc, rabby). Empty = all of the change's."
        default: ''

  workflow_call:
    inputs:
      repo:
        description: Repo the change is in (firmware, app, api-rs, api-go, api-ts, rabby)
        type: string
        required: true
      head:
        description: Head commit SHA or branch
        type: string
        required: true
      head_repo:
        description: Fork holding head (owner/repo), empty if in the upstream repo
        type: string
        default: ''
      base:
        description: Base branch or commit of the upstream repo
        type: string
        default: ''
      pins:
        description: Space-separated repo=ref pins
        type: string
        default: ''
      graphical:
        description: Space-separated unit globs for extra graphical runs
        type: string
        default: ''
      tests:
        description: Space-separated BitBoxApp Playwright test files
        type: string
        default: ''
      flows:
        description: Explicit space-separated flows (overrides PR checkboxes when set)
        type: string
        default: ''
      pr_body:
        description: PR description Markdown (checkboxes like `- [x] wc` pick flows when `flows` is empty)
        type: string
        default: ''
      e2e_repo:
        description: Repository hosting bitbox-e2e
        type: string
        default: Tomasvrba/bitbox-e2e
      e2e_ref:
        description: Ref of bitbox-e2e to check out
        type: string
        default: main
    secrets:
      pages_token:
        description: Optional PAT with contents:write on e2e_repo to host reports on its gh-pages
        required: false
    outputs:
      flows:
        description: JSON list of flows that ran
        value: ${{ jobs.plan.outputs.flows }}
      summary:
        description: Rendered summary.md Markdown for posting as a PR comment
        value: ${{ jobs.report.outputs.summary }}
      report_url:
        description: Public URL of the published HTML report (empty if gh-pages publishing was skipped)
        value: ${{ jobs.report.outputs.report_url }}

# Code from the refs above builds and runs here: no secrets, read-only token.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      flows: ${{ steps.flows.outputs.flows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.e2e_repo || github.repository }}
          ref: ${{ inputs.e2e_ref || '' }}
          path: e2e
          persist-credentials: false
      - id: flows
        env:
          REPO: ${{ inputs.repo }}
          FLOWS: ${{ inputs.flows }}
          PR_BODY: ${{ inputs.pr_body }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "e2e")
          from bitbox_e2e.config import FLOWS, parse_pr_checkboxes

          repo = os.environ["REPO"]
          explicit = os.environ.get("FLOWS", "").strip()
          body = os.environ.get("PR_BODY", "")
          if explicit:
              selected = explicit.split()
          elif body:
              selected = parse_pr_checkboxes(body, repo)
          else:
              selected = list(FLOWS[repo])
          print(f"flows={json.dumps(selected)}")
          PY

  flow:
    needs: plan
    if: ${{ needs.plan.outputs.flows != '[]' }}
    name: ${{ matrix.flow }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(needs.plan.outputs.flows) }}
    steps:
      # The harness finds its siblings next to a checkout named e2e.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.e2e_repo || github.repository }}
          ref: ${{ inputs.e2e_ref || '' }}
          path: e2e
          persist-credentials: false
      # The firmware for the simulators, also when the change is elsewhere.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BitBoxSwiss/bitbox02-firmware
          path: bitbox02-firmware
          fetch-depth: 0  # merge-base of base and head
          submodules: recursive
          persist-credentials: false
      # Full history: the API suites run from `git clone --shared` copies of these, and the app and
      # Rabby flows build the changed library at base and head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BitBoxSwiss/bitbox-api-rs
          path: bitbox-api-rs
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BitBoxSwiss/bitbox02-api-go
          path: bitbox02-api-go
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BitBoxSwiss/bitbox-api-ts
          path: bitbox-api-ts
          fetch-depth: 0
          persist-credentials: false
      - if: inputs.repo == 'app' || matrix.flow == 'app' || matrix.flow == 'wc'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BitBoxSwiss/bitbox-wallet-app
          path: bitbox-wallet-app
          fetch-depth: 0
          persist-credentials: false
      - if: inputs.repo == 'rabby' || matrix.flow == 'rabby'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RabbyHub/Rabby
          path: Rabby
          fetch-depth: 0
          persist-credentials: false

      - name: Root prerequisites
        run: sudo e2e/ci/prereqs.sh

      # What setup.sh downloads (LLVM, protoc, cmocka, uv, cmake, node, anvil): ~2G.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/bitbox-e2e/tools
          key: tools-${{ runner.os }}-${{ hashFiles('e2e/setup.sh') }}

      - name: e2e pr
        env:
          REPO: ${{ inputs.repo }}
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          HEAD_REPO: ${{ inputs.head_repo }}
          PINS: ${{ inputs.pins }}
          GRAPHICAL: ${{ inputs.graphical }}
          TESTS: ${{ inputs.tests }}
          FLOW: ${{ matrix.flow }}
        run: >-
          e2e/ci/pr.sh --repo "$REPO" ${BASE:+--base "$BASE"} --head "$HEAD" ${HEAD_REPO:+--head-repo "$HEAD_REPO"}
          --pins "$PINS" --graphical "$GRAPHICAL" --tests "$TESTS" --flows "$FLOW" --out "$RUNNER_TEMP/report"

      # A runner out of disk or memory gets cancelled without a word in the log.
      - name: Disk and memory
        if: ${{ !success() }}
        run: df -h / "$RUNNER_TEMP" ~; free -m

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-flow-${{ matrix.flow }}
          path: ${{ runner.temp }}/report
          if-no-files-found: warn

  # The run's page: every flow writes into <out>/<flow>/, so combining them is a flat copy per flow.
  # Rendering only reads those files and never executes PR code.
  report:
    needs: [plan, flow]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      summary: ${{ steps.render.outputs.summary }}
      report_url: ${{ steps.render.outputs.report_url }}
    steps:
      - if: ${{ needs.plan.outputs.flows != '[]' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.e2e_repo || github.repository }}
          ref: ${{ inputs.e2e_ref || '' }}
          path: e2e
          persist-credentials: false
      - if: ${{ needs.plan.outputs.flows != '[]' }}
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - if: ${{ needs.plan.outputs.flows != '[]' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-flow-*
          path: ${{ runner.temp }}/flows
          merge-multiple: true
      - id: render
        name: e2e report and publish
        env:
          FLOWS: ${{ needs.plan.outputs.flows }}
          E2E_REPO: ${{ inputs.e2e_repo || github.repository }}
          CALLER_REPO: ${{ github.repository }}
          PAGES_TOKEN: ${{ secrets.pages_token }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/report"
          mkdir -p "$out"
          report_url=""
          if [ "$FLOWS" = "[]" ]; then
            cat > "$out/summary.md" <<'MD'
          ### ℹ️ No e2e flows selected

          Check at least one flow checkbox in the PR description (e.g. `- [x] device`, `- [x] app`, `- [x] wc`, `- [x] rabby`) and re-add the `run-e2e` label.
          MD
          else
            uv sync --frozen --project e2e --no-dev
            for flow in $(python3 -c 'import json, sys; print(" ".join(json.loads(sys.argv[1])))' "$FLOWS"); do
              part="$RUNNER_TEMP/flows/$flow"
              [ -d "$part" ] || part="$RUNNER_TEMP/flows/e2e-flow-$flow/$flow"
              mkdir -p "$out/$flow"
              if [ -f "$part/findings.json" ] || [ -f "$part/flow-error.json" ]; then
                cp -r "$part/." "$out/$flow/"
              else
                echo "::warning::flow $flow left no results"
                python3 -c 'import json, sys; print(json.dumps({"flow": sys.argv[1], "error": "CI job produced no results; see the workflow log"}))' "$flow" > "$out/$flow/flow-error.json"
              fi
            done
            uv run --project e2e --no-sync e2e report "$out"

            # Publish report-files.txt to gh-pages (e2e_repo when running there or with pages_token,
            # else the calling repo's gh-pages). Re-render summary.md with inline image URLs if pushed.
            if [ -n "$PAGES_TOKEN" ]; then
              pub_repo="$E2E_REPO"
              pub_token="$PAGES_TOKEN"
            elif [ "$CALLER_REPO" = "$E2E_REPO" ]; then
              pub_repo="$E2E_REPO"
              pub_token="$GH_TOKEN"
            else
              pub_repo="$CALLER_REPO"
              pub_token="$GH_TOKEN"
            fi
            pub_owner="${pub_repo%%/*}"
            pub_name="${pub_repo#*/}"
            base_url="https://${pub_owner,,}.github.io/${pub_name}/runs/${RUN_ID}"

            pages_dir="$RUNNER_TEMP/gh-pages"
            rm -rf "$pages_dir"
            git init -q "$pages_dir"
            git -C "$pages_dir" config user.name "bitbox-e2e[bot]"
            git -C "$pages_dir" config user.email "bitbox-e2e[bot]@users.noreply.github.com"
            remote="https://x-access-token:${pub_token}@github.com/${pub_repo}.git"
            if git -C "$pages_dir" fetch -q --depth=1 "$remote" gh-pages 2>/dev/null; then
              git -C "$pages_dir" checkout -q -B gh-pages FETCH_HEAD
            else
              git -C "$pages_dir" checkout -q --orphan gh-pages
            fi
            touch "$pages_dir/.nojekyll"
            dest="$pages_dir/runs/$RUN_ID"
            rm -rf "$dest"
            mkdir -p "$dest"
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              mkdir -p "$dest/$(dirname "$rel")"
              cp "$out/$rel" "$dest/$rel"
            done < "$out/report-files.txt"
            git -C "$pages_dir" add -A
            pushed=0
            if git -C "$pages_dir" diff --cached --quiet; then
              pushed=1
            else
              git -C "$pages_dir" commit -qm "e2e report: run $RUN_ID"
              for attempt in 1 2 3; do
                if git -C "$pages_dir" push -q "$remote" gh-pages; then
                  pushed=1
                  break
                fi
                git -C "$pages_dir" fetch -q --depth=1 "$remote" gh-pages && git -C "$pages_dir" rebase -q FETCH_HEAD || break
              done
            fi
            if [ "$pushed" -eq 1 ]; then
              report_url="$base_url/report.html"
              uv run --project e2e --no-sync e2e report "$out" --base-url "$base_url"
            else
              echo "::warning::Could not push report to $pub_repo gh-pages; falling back to artifact link only"
            fi
          fi
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "report_url=$report_url" >> "$GITHUB_OUTPUT"
          eof="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          {
            echo "summary<<$eof"
            cat "$out/summary.md"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ needs.plan.outputs.flows != '[]' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
