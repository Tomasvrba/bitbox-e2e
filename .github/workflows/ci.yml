name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Sync environment
        run: uv sync --frozen

      - name: Lint Python
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest

      - name: Lint shell scripts
        run: shellcheck build-sim.sh setup.sh env.sh isolated.sh ci/*.sh
